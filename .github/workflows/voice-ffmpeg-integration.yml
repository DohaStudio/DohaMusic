name: Voice FFmpeg integration

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  backend-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
      - name: Install Backend
        run: python -m pip install -e ".[dev]"
      - name: Compile first-party Python
        run: python -m compileall -q backend ai_worker
      - name: Ruff lint
        run: python -m ruff check --no-cache backend ai_worker
      - name: Ruff format
        run: python -m ruff format --check --no-cache backend ai_worker
      - name: Backend tests with real FFmpeg
        run: python -m pytest -q

  ffmpeg-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          ffmpeg -version
      - name: Install Backend
        run: python -m pip install -e ".[dev]"
      - name: Windows FFmpeg integration
        run: python -m pytest -q backend/tests/test_voice_enrollment_audio.py -m integration
      - name: Windows ceremony serialization, private facts and witness mechanics
        shell: pwsh
        run: |
          # Hosted runneradmin may be RID 500. Do not widen the production SID profile.
          # This disposable non-admin account exists ONLY on the ephemeral CI VM.
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_OS -ne 'Windows') { throw 'Hosted Windows CI fixture only' }
          $fixtureName = 'doha-ci-' + [guid]::NewGuid().ToString('N').Substring(0, 8)
          $fixturePassword = [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(32)) + '!Aa9'
          $fixtureSecret = ConvertTo-SecureString $fixturePassword -AsPlainText -Force
          $fixtureCredential = [pscredential]::new("$env:COMPUTERNAME\$fixtureName", $fixtureSecret)
          $fixtureRoot = Join-Path $env:WINDIR ('Temp\' + $fixtureName)
          $fixtureCreated = $false
          try {
            $fixtureUser = New-LocalUser -Name $fixtureName -Password $fixtureSecret -AccountNeverExpires -PasswordNeverExpires
            $fixtureCreated = $true
            if ([int]($fixtureUser.SID.Value.Split('-')[-1]) -lt 1000) { throw 'Unsupported disposable account SID' }
            Add-LocalGroupMember -SID 'S-1-5-32-545' -Member $fixtureUser
            New-Item -ItemType Directory -Path $fixtureRoot | Out-Null
            $fixtureAcl = Get-Acl -LiteralPath $fixtureRoot
            $fixtureRule = [Security.AccessControl.FileSystemAccessRule]::new($fixtureUser.SID, 'FullControl', 'ContainerInherit,ObjectInherit', 'None', 'Allow')
            $fixtureAcl.AddAccessRule($fixtureRule)
            Set-Acl -LiteralPath $fixtureRoot -AclObject $fixtureAcl
            $fixtureOutput = Join-Path $fixtureRoot 'stdout.txt'
            $fixtureError = Join-Path $fixtureRoot 'stderr.txt'
            $fixtureTemp = Join-Path $fixtureRoot 'pytest'
            $fixtureArgs = '-m pytest -q --basetemp "' + $fixtureTemp + '" backend/tests/test_bootstrap_windows_serialization.py backend/tests/test_bootstrap_witness_lifetime.py backend/tests/test_bootstrap_pin_facts.py backend/tests/test_bootstrap_private_pin_reader.py backend/tests/test_designation_record_snapshot.py backend/tests/test_designation_source_custody.py'
            $fixtureProcess = Start-Process -FilePath (Get-Command python).Source -ArgumentList $fixtureArgs -Credential $fixtureCredential -LoadUserProfile -WorkingDirectory $env:GITHUB_WORKSPACE -WindowStyle Hidden -RedirectStandardOutput $fixtureOutput -RedirectStandardError $fixtureError -Wait -PassThru
            Get-Content -LiteralPath $fixtureOutput
            Get-Content -LiteralPath $fixtureError
            if ($fixtureProcess.ExitCode -ne 0) { throw "Native pytest failed: $($fixtureProcess.ExitCode)" }
          } finally {
            if ($fixtureCreated) { Remove-LocalUser -Name $fixtureName }
            $fixtureSecret.Dispose()
            $fixturePassword = $null
            $fixtureCredential = $null
          }

  frontend-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
      - name: Install Backend
        run: python -m pip install -e ".[dev]"
      - name: Install Frontend
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build Frontend
        working-directory: frontend
        run: npm run build
      - name: Configured-parallel Playwright
        working-directory: frontend
        run: npm run test:e2e
      - name: Full-stack Export Playwright
        working-directory: frontend
        env:
          DOHA_E2E_PYTHON: python
          DOHA_E2E_RUNTIME_ROOT: ${{ runner.temp }}/dohamusic-fullstack-export
          DOHA_E2E_ALLOWED_PARENT: ${{ runner.temp }}
          DOHA_E2E_SEED_FILE: ${{ runner.temp }}/dohamusic-fullstack-export-seed.json
        run: npm run test:e2e -- --config playwright.export.config.ts

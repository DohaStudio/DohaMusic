[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dohamusic-backend"
version = "0.1.0"
description = "DohaMusic Backend Foundation"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.14,<2.0",
  "dohastudio-common-ai-contracts @ git+https://github.com/DohaStudio/.github.git@dd75fc88c16e9ae9a04acfafb72756a905f6365b",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "numpy>=1.26,<3.0",
  "psutil>=6.0,<8.0",
  "pyloudnorm>=0.2,<0.3",
  "python-multipart>=0.0.20,<1.0",
  "scipy>=1.14,<2.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff==0.16.4",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
markers = [
  "integration: isolated runtime integration test",
  "gpu: requires a CUDA-capable GPU",
  "slow: long-running model load or inference test",
  "benchmark: explicit repeatability or performance benchmark",
  "external: requires explicit external service opt-in",
  "paid: may incur external API charges",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# These executable scripts add the repository root to sys.path before importing
# first-party modules, so their imports must intentionally follow bootstrap code.
"ai_worker/scripts/compare_audio_outputs.py" = ["E402"]
"ai_worker/scripts/run_ace_step_benchmark.py" = ["E402"]
"ai_worker/scripts/run_demucs_benchmark.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = false

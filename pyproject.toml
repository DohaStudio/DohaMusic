[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dohamusic-backend"
version = "0.1.0"
description = "DohaMusic Backend Foundation"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "numpy>=1.26,<3.0",
  "psutil>=6.0,<8.0",
  "pyloudnorm>=0.2,<0.3",
  "python-multipart>=0.0.20,<1.0",
  "scipy>=1.14,<2.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.12,<1.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
markers = [
  "integration: isolated runtime integration test",
  "gpu: requires a CUDA-capable GPU",
  "slow: long-running model load or inference test",
  "benchmark: explicit repeatability or performance benchmark",
  "external: requires explicit external service opt-in",
  "paid: may incur external API charges",
]
